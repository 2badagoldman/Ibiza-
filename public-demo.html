<style>

  let filter = 'all', order = [], slides = [], cur = -1;
  const pool = () => CLIPS.filter((c) => filter === 'all' || (filter === 'soon' ? c.soon : !c.soon));
  function rank(list) { return list.map((c) => [c, score(c)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]); }
  function slideHTML(c) {
    return `<video playsinline muted loop preload="none" poster="${esc(c.poster)}" data-src="${esc(c.url)}"></video><div class="shade"></div>
      <div class="cap"><span class="tag${c.soon ? ' soon' : ''}"><i></i>${c.soon ? 'COMING SOON' : 'LIVE NOW'}</span><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p>
      ${c.song ? `<div class="song"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#222"/><circle cx="12" cy="12" r="4" fill="#ff2d6f"/></svg><span>${esc(c.song)}</span></div>` : ''}
      <span class="why"></span><br>${c.soon ? `<button type="button" class="cta soon" data-want>✋ I want this</button>` : `<a class="cta" href="${esc(c.cta)}" data-try>${esc(c.ctaLabel || 'Try it now')} →</a>`}</div>
      <div class="rail"><button type="button" class="lv" aria-label="Love"><span class="ic"><svg viewBox="0 0 24 24"><path d="${HEART}"/></svg></span><span class="n"></span></button>
      <button type="button" class="sh" aria-label="Share"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 4l7 7-7 7v-4c-5 0-8.5 1.6-11 5 1-5 4-10 11-11V4z"/></svg></span><span>Share</span></button></div>
      <div class="prog"><b></b></div>`;
  }
  function add(c) {
    const el = document.createElement('section'); el.className = 'slide'; el.dataset.id = c.id; el.innerHTML = slideHTML(c);
    feed.appendChild(el); slides.push({ c, el, v: el.querySelector('video'), t0: 0, watched: 0, counted: false }); io.observe(el); paintRail(slides[slides.length - 1]);
  }
  function rebuild() {
    feed.innerHTML = ''; slides = []; cur = -1;
    order = rank(pool()); order.forEach(add); feed.scrollTop = 0;
    setTimeout(() => activate(0), 60);
  }
  // after every swipe: re-rank what hasn't been shown yet, and keep the feed endless
  function rerankAhead() {
    const ahead = slides.slice(cur + 1);
    if (ahead.length < 3) { rank(pool()).slice(0, 6).forEach(add); return; }
    const want = rank(ahead.map((s) => s.c));
    ahead.forEach((s, i) => {
      if (s.c === want[i]) return;
      const keep = s.el; const nc = want[i];
      s.c = nc; keep.dataset.id = nc.id; keep.innerHTML = slideHTML(nc); s.v = keep.querySelector('video'); s.counted = false; s.watched = 0; paintRail(s);
    });
  }

  // ---------- playing ----------
  const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting && e.intersectionRatio > 0.6) activate(slides.findIndex((s) => s.el === e.target)); }, { root: feed, threshold: [0.6] });
  function load(s) { if (s && !s.v.src) { s.v.src = s.v.dataset.src; s.v.preload = 'auto'; } }
  function leave(s) {
    if (!s) return;
    s.v.pause();
    const d = s.v.duration || 9, secs = s.watched;
    if (secs > 0.6) {
      const r = st(s.c.id); r.v++; r.last = ++M.n;
      const frac = Math.min(3, secs / d); r.w += frac; if (frac < 0.25) r.s++; if (frac >= 1) r.f++;
      bump(s.c, frac >= 1 ? 0.6 : frac >= 0.5 ? 0.25 : frac < 0.25 ? -0.35 : 0);
      save();
    }
    s.watched = 0;
  }
  function activate(i) {
    if (i < 0 || i === cur) return;
    leave(slides[cur]); cur = i;
    const s = slides[i]; if (!s) return;
    load(s); load(slides[i + 1]);
    s.el.classList.remove('paused');
    s.v.currentTime = 0; const p = s.v.play(); if (p && p.catch) p.catch(() => s.el.classList.add('paused'));
    $('#bgblur').style.backgroundImage = `url("${s.c.poster}")`;
    const w = why(s.c); s.el.querySelector('.why').textContent = w ? '✨ ' + w : '';
    rerankAhead();
    try { history.replaceState(null, '', '#' + s.c.id); } catch {}
  }
  let lastT = performance.now();
  (function tick(t) {
    const s = slides[cur], dt = Math.min(0.25, (t - lastT) / 1000); lastT = t;
    if (s && !s.v.paused && !document.hidden) { s.watched += dt; const b = s.el.querySelector('.prog b'); if (b && s.v.duration) b.style.width = (s.v.currentTime / s.v.duration * 100) + '%'; }
    requestAnimationFrame(tick);
  })(lastT);
  document.addEventListener('visibilitychange', () => { const s = slides[cur]; if (!s) return; if (document.hidden) s.v.pause(); else if (!s.el.classList.contains('paused')) s.v.play().catch(() => {}); });

  // ---------- taps: pause, double-tap love, love, share, try, want ----------
  function paintRail(s) { const r = st(s.c.id), b = s.el.querySelector('.lv'); b.classList.toggle('on', r.l > 0); b.querySelector('.n').textContent = r.l ? String(r.l) : 'Love'; const w = s.el.querySelector('[data-want]'); if (w && r.k) { w.classList.add('done'); w.textContent = '✓ You voted for this'; } }
  function love(s, x, y) {
    const r = st(s.c.id); r.l++; bump(s.c, 1.2); save(); paintRail(s);
    const b = s.el.querySelector('.lv'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    if (x != null) { const h = document.createElement('div'); h.className = 'big'; const rc = s.el.getBoundingClientRect(); h.style.left = (x - rc.left) + 'px'; h.style.top = (y - rc.top) + 'px'; h.innerHTML = `<svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset=".5" stop-color="#ff2d6f"/><stop offset="1" stop-color="#c13cff"/></linearGradient></defs><path fill="url(#g)" d="${HEART}"/></svg>`; s.el.appendChild(h); setTimeout(() => h.remove(), 950); }
    toast(r.l > 1 ? `♥ ${r.l} loves. More like this coming up` : '♥ Loved. More like this coming up');
    rerankAhead();
  }
  let tapT = null, lastTap = 0;
  feed.addEventListener('click', (e) => {
    const s = slides.find((x) => x.el.contains(e.target)); if (!s) return;
    if (e.target.closest('.lv')) { love(s); return; }
    if (e.target.closest('.sh')) { share(s); return; }
    if (e.target.closest('[data-try]')) { const r = st(s.c.id); r.k++; bump(s.c, 1); save(); return; }
    if (e.target.closest('[data-want]')) { const r = st(s.c.id); if (!r.k) { r.k++; bump(s.c, 1); save(); paintRail(s); toast('✋ Vote counted. We build what you want first'); } return; }
    if (e.target.closest('.cap a, .tabs')) return;
    const now = Date.now();
    if (now - lastTap < 300) { clearTimeout(tapT); lastTap = 0; love(s, e.clientX, e.clientY); return; }
    lastTap = now;
    tapT = setTimeout(() => { if (s.v.paused) { s.v.play().catch(() => {}); s.el.classList.remove('paused'); } else { s.v.pause(); s.el.classList.add('paused'); } }, 300);
  });
  async function share(s) {
    const url = location.origin + '/demo#' + s.c.id, text = `${s.c.title} on Ibiza, the free AI DJ`;
    try { if (navigator.share) { await navigator.share({ title: 'Ibiza', text, url }); return; } } catch { return; }
    try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch { toast(url); }
  }
  function toast(t) { const o = $('.toast'); if (o) o.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }
  document.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); feed.scrollBy({ top: innerHeight, behavior: 'smooth' }); } if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); feed.scrollBy({ top: -innerHeight, behavior: 'smooth' }); } if (e.key === 'l') { const s = slides[cur]; if (s) love(s); } });
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (!b || b.dataset.f === filter) return; filter = b.dataset.f; document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b)); leave(slides[cur]); rebuild(); });

  // ---------- start: a shared link (#clip) opens on that clip first ----------
  const first = location.hash.slice(1);
  rebuild();
  if (first) { const i = slides.findIndex((s) => s.c.id === first); if (i > 0) { const [x] = slides.splice(i, 1); feed.insertBefore(x.el, feed.firstChild); slides.unshift(x); setTimeout(() => { cur = -1; activate(0); }, 80); } }
  if (!M.hinted) { M.hinted = 1; save(); const h = document.createElement('div'); h.className = 'hint'; h.innerHTML = '<b>☝️</b> Swipe up for the next one'; document.body.appendChild(h); setTimeout(() => h.remove(), 3100); }
})();
</script>
</body>
</html>
